name: IPLTrackX Auto-Bot

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Auth Files (The Bulletproof Method)
        env:
          TOKEN_DATA: ${{ secrets.TOKEN_JSON }}
          CRED_DATA: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          import os
          
          # Write Token
          token_content = os.environ.get("TOKEN_DATA", "")
          if token_content:
              with open("token.json", "w") as f:
                  f.write(token_content)
              print("✅ token.json created.")
          else:
              print("❌ Error: TOKEN_JSON secret is empty!")

          # Write Credentials
          cred_content = os.environ.get("CRED_DATA", "")
          if cred_content:
              with open("credentials.json", "w") as f:
                  f.write(cred_content)
              print("✅ credentials.json created.")
          else:
              print("❌ Error: CREDENTIALS_JSON secret is empty!")
        shell: python

      - name: Run The Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python control/main.py

      - name: Keep History Alive
        run: |
          git config --global user.name "IPLBot"
          git config --global user.email "bot@ipltrackx.com"
          git add data/history.txt
          git commit -m "📝 Update History [skip ci]" || echo "No changes to commit"
          git push
